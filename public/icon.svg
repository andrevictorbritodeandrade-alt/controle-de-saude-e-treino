<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181c" />
      <stop offset="100%" stop-color="#0c0c0e" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <!-- Fundo Squircle Dark -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <!-- Brilho Ambiente Vermelho -->
  <path d="M 115,256 L 185,256 L 228,150 L 278,355 C 305,275 320,240 342,242 C 358,244 365,256 397,256" 
        fill="none" 
        stroke="#ef4444" 
        stroke-width="50" 
        stroke-linecap="round" 
        stroke-linejoin="round" 
        opacity="0.25" />
  <!-- Linha de Pulso Principal -->
  <path d="M 115,256 L 185,256 L 228,150 L 278,355 C 305,275 320,240 342,242 C 358,244 365,256 397,256" 
        fill="none" 
        stroke="#ff334b" 
        stroke-width="26" 
        stroke-linecap="round" 
        stroke-linejoin="round" 
        filter="url(#glow)" />
</svg>
